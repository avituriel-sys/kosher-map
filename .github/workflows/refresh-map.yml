name: Refresh public map data

# Regenerates web/businesses.json from the current database (picks up
# any business_override correction - see scripts/export_map_data.py),
# pushes it if it changed, and deploys it directly (see the deploy step
# below for why this workflow can't just rely on deploy-pages.yml's own
# push trigger).
#
# Manual only (workflow_dispatch): triggered from this repo's Actions
# tab ("Run workflow"), or `gh workflow run refresh-map.yml`, whenever
# an admin has resolved corrections/anomalies worth publishing. Not on
# a schedule - collect.yml's weekly run doesn't touch business_override
# or businesses.json, so this is a deliberate, separate action.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Same group as deploy-pages.yml - the two must never deploy to Pages
# concurrently, so they serialize (and a newer run cancels a stale one)
# against each other, not just against other runs of this workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A re-run of an old workflow run (as opposed to a fresh dispatch)
      # replays against that run's *original* commit, not master's
      # current tip - and even a fresh dispatch can go stale if other
      # pushes land before this job starts. Sync to the real tip before
      # generating anything, so the export below is always diffed
      # against current master and the push at the end can't be
      # rejected as non-fast-forward for a reason this workflow could
      # have avoided.
      - name: Sync to latest master
        run: |
          git fetch origin master
          git reset --hard origin/master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.export_map_data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit and push if businesses.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/businesses.json
          git diff --cached --quiet || git commit -m "Refresh map data from admin corrections"
          git push
      # A push authenticated with this workflow's own GITHUB_TOKEN does
      # NOT trigger deploy-pages.yml's `on: push` listener - GitHub
      # deliberately blocks the default token from starting other
      # workflows, to prevent infinite trigger loops. Confirmed live
      # 2026-09-17: two refresh runs pushed real data changes and
      # neither produced a deploy-pages.yml run, so the site kept
      # serving a stale snapshot indefinitely. Deploying directly here
      # instead of hoping the other workflow fires.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
